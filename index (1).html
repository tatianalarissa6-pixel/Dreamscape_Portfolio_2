<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to My World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2240%22 r=%2224%22 fill=%22none%22 stroke=%22black%22 stroke-width=%227%22/%3E%3C/svg%3E">
<style>
  :root { --paper:#fdfdfb; --ink:#161616; --void:#0b0b10; --sans:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); font-family:var(--sans); color:var(--ink); }
  .scene { position:absolute; inset:0; }

  /* ---------- SCENE 1: sketch ---------- */
  #scene1 { transform-origin:0 0; will-change:transform; }
  #scene1 svg { width:100%; height:100%; display:block; }
  #scene1 text { font-family:var(--sans); }
  .btn { cursor:pointer; outline:none; }
  .btn .focus { opacity:0; }
  .btn:focus-visible .focus { opacity:1; }

  /* ---------- SCENE 2: the mind (rough placeholder) ---------- */
  #void { display:none; background:var(--void); overflow:hidden; perspective:1100px; }
  #void::before { content:""; position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #ffffff55, transparent),
      radial-gradient(1px 1px at 78% 14%, #ffffff44, transparent),
      radial-gradient(1.5px 1.5px at 64% 72%, #ffffff33, transparent),
      radial-gradient(1px 1px at 32% 84%, #ffffff44, transparent),
      radial-gradient(1px 1px at 90% 58%, #ffffff33, transparent),
      radial-gradient(1.5px 1.5px at 46% 40%, #ffffff22, transparent); }
  #space { position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; }
  .card { position:absolute; left:0; top:0; padding:14px; background:#fbfaf7; color:#222; border-radius:2px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); display:flex; flex-direction:column; justify-content:space-between;
    font-size:18px; line-height:1.15; will-change:transform, opacity; }
  .card b { font-weight:700; }
  .tag { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#666; }
  .tag.light { color:#fff; text-shadow:0 1px 2px #0008; }
  .ph { flex:1; margin:10px 0; background:repeating-linear-gradient(45deg,#ebe7de 0 8px,#f4f1ea 8px 16px);
    display:grid; place-items:center; text-align:center; padding:10px; font-size:10px; color:#888; }
  .textile { background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 3px,transparent 3px 9px),
                         repeating-linear-gradient(90deg,#b5533c 0 7px,#d98b5f 7px 14px); }
  .textile.t2 { background:repeating-linear-gradient(0deg,rgba(255,255,255,.2) 0 2px,transparent 2px 8px),
                            repeating-linear-gradient(90deg,#2f4b7c 0 6px,#5b7db1 6px 12px); }
  .flag-ua { background:linear-gradient(#0057b7 50%, #ffd700 50%); padding:0; }
  .flag-br { background:#009c3b; padding:0; }
  .flag-br::before { content:""; position:absolute; inset:11% 7%; background:#ffdf00; clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .flag-br::after { content:""; position:absolute; left:50%; top:50%; width:31%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%;
    background:linear-gradient(168deg, transparent 46%, #fff 46% 55%, transparent 55%), #002776; }
  .saying .say { font-size:20px; font-style:italic; }
  .album { justify-content:flex-end; }
  .album::before { content:""; position:absolute; inset:20% 24% 32%; border-radius:50%; background:rgba(255,255,255,.22); }
  .history { background:#e8dcc4; }
  .history .big { font-size:48px; font-weight:700; color:#5a4630; }
  .featured { cursor:pointer; }
  .featured .ttl { font-size:22px; }
  .hanger { position:absolute; top:100%; left:58%; width:60px; height:98px; margin-top:-3px; overflow:visible;
    transform-origin:50% 0; animation:swing 2.2s ease-in-out infinite alternate; }
  @keyframes swing { from { transform:rotate(-10deg); } to { transform:rotate(10deg); } }
  .hanger.off { display:none; }
  .jumper { position:absolute; left:0; top:0; width:60px; height:98px; margin-left:-30px; display:none; transform-origin:50% 0; pointer-events:none; }
  .jumper svg { width:100%; height:100%; overflow:visible; }
  #hint { position:absolute; left:0; right:0; bottom:7%; text-align:center; color:#fff; font-size:12px; font-weight:700; letter-spacing:.3em; opacity:0; transition:opacity .6s; pointer-events:none; }
  #hint.show { opacity:.8; }

  /* ---------- placeholders ---------- */
  .end { display:none; place-items:center; text-align:center; padding:24px; }
  .end h1 { font-size:clamp(34px, 6vw, 64px); margin:.15em 0; font-weight:700; letter-spacing:-.01em; }
  .end p { font-size:17px; color:#555; max-width:36ch; margin:0 auto 1.4em; line-height:1.4; }
  .restart { font:inherit; font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; background:none; border:1.5px solid var(--ink); padding:10px 20px; cursor:pointer; color:var(--ink); }


  /* =====================================================================
     DREAMSCAPE v2 — worlds, gear room, ending
     ===================================================================== */
  :root { --pw: min(460px, 33vw); }

  /* ---------- the stick man (same drawing in every scene) ---------- */
  .stick { position:absolute; aspect-ratio:260/290; transform:translate(-50%,-93.1%); pointer-events:none; }
  .stick svg { width:100%; height:100%; overflow:visible; display:block; }
  .stick .ln { fill:none; stroke:var(--sc,#1b1b1b); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  .stick .eye { fill:var(--sc,#1b1b1b); }
  .stick .thin { stroke-width:2.6; }
  .stick .sc1, .stick .sc2 { fill:none; stroke:#c4534a; stroke-width:9; stroke-linecap:round; opacity:.88; }
  .stick .sc2 { stroke-width:8; }
  .stick .cbBoard { fill:rgba(185,138,90,.92); stroke:var(--sc,#1b1b1b); stroke-width:2.4; }
  .stick .cbPaper { fill:rgba(255,253,246,.96); }
  .stick .cbClip { fill:#8c8c8c; stroke:var(--sc,#1b1b1b); stroke-width:1.6; }
  .stick .cbLine { stroke:#6b7b93; stroke-width:1.6; stroke-linecap:round; }
  .stick .spark { stroke-width:3; }

  /* ---------- worlds ---------- */
  #world { display:none; background:#0b0b10; overflow:hidden; }
  #cam { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
  #stage { position:absolute; }
  #stage img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #props { position:absolute; inset:0; pointer-events:none; }
  .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.28)); }
  .wfade { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:7; }

  .hotspot { position:absolute; border:0; padding:0; background:transparent; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .6s; z-index:2; }
  .hotspot.on { opacity:1; pointer-events:auto; }
  .hotspot::before { content:""; position:absolute; inset:-6px; border:3px solid #fff6d8;
    box-shadow:0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.35), 0 0 26px 8px rgba(255,236,170,.75), inset 0 0 22px 4px rgba(255,236,170,.45);
    animation:pulse 1.8s ease-in-out infinite; }
  .hotspot.ellipse::before { border-radius:50%; }
  .hotspot:focus-visible { outline:3px dashed #2a6fdb; outline-offset:10px; }
  @keyframes pulse { 0%,100% { opacity:.5; transform:scale(1); } 50% { opacity:1; transform:scale(1.05); } }
  .hotspot .lbl { position:absolute; left:50%; top:calc(100% + 16px); transform:translateX(-50%); white-space:nowrap; font-size:12px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.66); padding:8px 12px; border-radius:2px; }

  .wtitle { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:#fff; pointer-events:none;
    opacity:0; transition:opacity .8s; text-shadow:0 2px 30px rgba(0,0,0,.55); padding:0 16px; z-index:6; }
  .wtitle.show { opacity:1; }
  .wtitle::before { content:""; position:absolute; left:50%; top:50%; width:min(1100px, 120vw); height:380px; transform:translate(-50%,-50%); z-index:-1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), rgba(0,0,0,.25) 45%, transparent 70%); }
  .wtitle .k { font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; }
  .wtitle h2 { font-size:clamp(44px, 8vw, 110px); margin:.12em 0 0; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .wtitle .sub { font-size:16px; margin-top:.6em; opacity:.92; }

  /* board panel (the background stays visible around it) */
  .panel { position:absolute; right:24px; top:50%; width:var(--pw); max-height:calc(100vh - 40px); display:flex; flex-direction:column;
    transform:translate(calc(100% + 60px), -50%); transition:transform .7s cubic-bezier(.2,.8,.2,1); z-index:5; }
  .panel.open { transform:translate(0, -50%); }
  .panel .inner { overflow:auto; padding:22px 22px 4px; }
  .panel .proj { font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; opacity:.65; padding-right:30px; }
  .panel h3 { font-size:22px; line-height:1.15; margin:.35em 0 .6em; letter-spacing:-.01em; }
  .panel p { font-size:14.5px; line-height:1.55; margin:0 0 12px; }
  .board { margin:0 0 12px; position:relative; cursor:zoom-in; }
  .board img { display:block; width:100%; max-height:calc(100vh - 300px); object-fit:contain; background:#fff; }
  .board .zoom { position:absolute; right:8px; bottom:8px; font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    background:rgba(0,0,0,.62); color:#fff; padding:5px 8px; pointer-events:none; }
  .pnav { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 22px 18px; }
  .pnav button, .pill { font:inherit; font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; padding:11px 16px;
    cursor:pointer; background:none; border:1.5px solid var(--pfg); color:var(--pfg); }
  .pnav button.primary { background:var(--pfg); color:var(--pbg); }
  .pnav button:disabled { opacity:.3; cursor:default; }
  .pnav .count { font-size:12px; letter-spacing:.15em; opacity:.7; }
  .pmin { position:absolute; top:12px; right:12px; width:30px; height:30px; border:0; background:none; color:inherit; font-size:20px; line-height:1; cursor:pointer; z-index:2; }
  .pill { position:absolute; right:24px; bottom:24px; z-index:5; display:none; background:var(--pbg); }

  .s-real { --pfg:#141414; --pbg:#ffffff; }
  .s-real .panel { color:#141414; background:rgba(255,255,255,.84); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 24px 70px rgba(0,0,0,.28); }

  .s-water { --pfg:#2c4a74; --pbg:#fbf8f1; }
  .s-water .panel { color:#2c3440; font-family:Georgia, "Times New Roman", serif; }
  .s-water .panel::before { content:""; position:absolute; inset:-10px; z-index:-1; filter:url(#wcEdge); opacity:.95;
    background:
      radial-gradient(circle at 14% 8%, rgba(130,180,225,.42), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(240,196,80,.34), transparent 40%),
      radial-gradient(circle at 80% 12%, rgba(196,106,60,.16), transparent 30%),
      #fbf8f1;
    box-shadow:0 20px 50px rgba(30,50,80,.25); }
  .s-water .panel h3 { font-style:italic; font-weight:400; font-size:26px; }
  .s-water .pnav button, .s-water .pill { font-family:var(--sans); border-radius:3px 8px 4px 9px; }
  .s-water .pill { background:#fbf8f1; }

  .s-ember { --pfg:#ffcf9a; --pbg:#1a120c; }
  .s-ember .panel { color:#f4e9dc; background:rgba(22,15,10,.74); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,170,90,.28); box-shadow:0 24px 70px rgba(0,0,0,.5), 0 0 40px rgba(255,120,40,.12); }
  .s-ember .stick svg { filter:drop-shadow(0 0 5px rgba(255,140,50,.75)); }

  /* living-room TV + doors */
  .tv { position:absolute; overflow:hidden; opacity:0; background:#000; transform-origin:50% 50%; }
  .tv .ch { position:absolute; inset:-4%; background-repeat:no-repeat; animation:tvflick 2.2s ease-in-out infinite; }
  .tv::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  @keyframes tvflick { 0%,100% { filter:brightness(1) saturate(1.2); transform:scale(1); } 30% { filter:brightness(1.25) saturate(1.3); } 55% { filter:brightness(.92) saturate(1.1); transform:scale(1.03); } 80% { filter:brightness(1.15) saturate(1.25); } }
  .tvglow { position:absolute; pointer-events:none; mix-blend-mode:screen; opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,160,70,.42), rgba(255,120,40,.12) 45%, transparent 70%); }
  .tvglow.on { animation:glowp 1.4s ease-in-out infinite alternate; }
  @keyframes glowp { from { opacity:.55; } to { opacity:.9; } }
  .doorbox { position:absolute; perspective:900px; }
  .portal { position:absolute; inset:0; background-size:cover; background-position:50% 40%; opacity:0; }
  .portal::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(255,255,240,.9), rgba(255,255,240,.35) 45%, rgba(255,255,240,0) 75%); }
  .leaf { position:absolute; top:0; height:100%; width:50%; background-repeat:no-repeat; display:none; }
  .leaf.l { left:0; transform-origin:left center; }
  .leaf.r { right:0; transform-origin:right center; }
  .vasehole { position:absolute; width:4%; aspect-ratio:1.6; border-radius:50%; transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(ellipse at center, #120602 0 42%, #4a2010 62%, rgba(140,70,35,.6) 70%, rgba(140,70,35,0) 74%); }

  /* lightbox */
  #lightbox { position:fixed; inset:0; background:rgba(10,10,10,.9); display:none; place-items:center; z-index:80; cursor:zoom-out; padding:24px; }
  #lightbox.open { display:grid; }
  #lightbox img { max-width:100%; max-height:86vh; box-shadow:0 20px 60px rgba(0,0,0,.6); background:#fff; display:block; margin:0 auto; }
  #lightbox p { color:#eee; text-align:center; font-size:13px; letter-spacing:.08em; margin:12px 0 0; }

  /* fire -> gear transition */
  #transit { position:fixed; inset:0; display:none; z-index:30; pointer-events:none; background:#120c08; }
  #transit .ember { position:absolute; inset:-10%; opacity:0;
    background:radial-gradient(circle at 50% 50%, #fff3c4 0, #ffc46b 18%, #f07a1a 42%, #8a2a06 70%, #2a0a02 100%); }
  #transit .ember.flick { animation:emb .22s steps(2) infinite; }
  @keyframes emb { 50% { filter:brightness(1.12) hue-rotate(-6deg); } }
  #tgear { position:absolute; left:50%; top:50%; width:min(70vmin, 640px); height:min(70vmin, 640px); transform:translate(-50%,-50%) scale(.6); opacity:0; overflow:visible; }
  #tgear .spin { transform-box:fill-box; transform-origin:center; animation:spin 9s linear infinite; }

  /* ---------- gear room ---------- */
  #gears { display:none; overflow:hidden; perspective:2200px; background:transparent; z-index:4; }
  #gpage { position:absolute; inset:0; transform-style:preserve-3d; transform-origin:right center; }
  #gpage .front { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:radial-gradient(ellipse at 50% 40%, #2b211a 0%, #17110d 55%, #0b0806 100%); }
  #gpage .back { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; transform:rotateY(180deg);
    background:linear-gradient(120deg, #efe8dc, #d9cfbf); }
  #gsvg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .spin { transform-box:fill-box; transform-origin:center; animation:spin var(--d,40s) linear infinite; }
  .spin.rev { animation-direction:reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ggear { cursor:pointer; outline:none; }
  .ggear .bump { transform-box:fill-box; transform-origin:center; }
  .ggear .halo { opacity:.0; transition:opacity .3s; }
  .ggear:hover .halo, .ggear:focus-visible .halo { opacity:.85; }
  .ggear.done .halo { opacity:.55; }
  .ggear .badge { opacity:0; transition:opacity .4s; }
  .ggear.done .badge { opacity:1; }
  .glabel { font-family:var(--sans); fill:#f1e3c8; text-anchor:middle; pointer-events:none; }
  .glabel .n { font-size:15px; font-weight:700; letter-spacing:4px; fill:#e0b660; }
  .glabel .t { font-size:21px; font-weight:700; }
  .ghead { position:absolute; left:0; right:0; top:22px; text-align:center; color:#f1e3c8; z-index:3; pointer-events:none; padding:0 16px; }
  .ghead .k { font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:#e0b660; }
  .ghead h2 { font-size:clamp(28px, 4vw, 46px); margin:.15em 0 .1em; letter-spacing:-.01em; }
  .ghead p { font-size:14px; margin:0; opacity:.8; }
  .bubble { position:absolute; width:min(380px, calc(100vw - 32px)); background:#fffaf0; color:#2a1f17; border:2.5px solid #1b1410; border-radius:22px;
    padding:18px 20px 14px; box-shadow:0 18px 40px rgba(0,0,0,.45); z-index:6; opacity:0; transform:scale(.85); transform-origin:var(--ox,0) 50%;
    transition:opacity .25s, transform .35s cubic-bezier(.2,1.4,.4,1); pointer-events:none; }
  .bubble.show { opacity:1; transform:none; pointer-events:auto; }
  .bubble::before { content:""; position:absolute; top:var(--ty,50%); width:22px; height:22px; background:#fffaf0; border:2.5px solid #1b1410; transform:translateY(-50%) rotate(45deg); }
  .bubble.toright::before { left:-13px; border-top:0; border-right:0; }
  .bubble.toleft::before { right:-13px; border-bottom:0; border-left:0; }
  .bubble .bk { font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:#a0702a; }
  .bubble h4 { font-size:20px; margin:.25em 0 .45em; }
  .bubble p { font-size:14.5px; line-height:1.55; margin:0 0 10px; }
  .bubble .bclose { font:inherit; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; border:1.5px solid #2a1f17; background:#2a1f17;
    color:#fffaf0; padding:9px 14px; cursor:pointer; margin-top:4px; }
  .flap { position:absolute; left:0; bottom:0; width:0; height:0; clip-path:polygon(0 0, 100% 100%, 100% 0); z-index:4;
    background:linear-gradient(225deg, #f6f0e5 0%, #ddd3c2 55%, #bdb19d 100%); }
  .flapsh { position:absolute; inset:0; pointer-events:none; z-index:4; filter:drop-shadow(5px -5px 10px rgba(0,0,0,.55)); }
  #gguy { position:absolute; inset:0; pointer-events:none; z-index:5; }
  #gguy .stick svg { filter:drop-shadow(0 0 1.5px rgba(0,0,0,.95)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }

  /* ---------- the professional ---------- */
  #prof { display:none; place-items:center; background:#f1efe9; padding:56px 24px 90px; z-index:3; }
  #prof .ptag { position:absolute; left:24px; top:20px; font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:#555; }
  #prof img { display:block; max-width:min(1100px, 100%); max-height:calc(100vh - 150px); background:#fff; box-shadow:0 18px 50px rgba(0,0,0,.14); }
  #profguy { position:absolute; left:0; bottom:0; width:12vw; height:30vh; pointer-events:none; }
  #continue { position:fixed; right:28px; bottom:26px; z-index:20; font:inherit; font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    padding:14px 22px; background:#161616; color:#fff; border:0; cursor:pointer; opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity .8s, transform .8s; display:none; }
  #continue.show { opacity:1; transform:none; pointer-events:auto; }

  /* ---------- lights out + exit sign ---------- */
  #blackout { position:fixed; inset:0; background:#000; opacity:0; display:none; z-index:60; }
  #blackout .spill { position:absolute; right:-10vw; top:-20vh; width:70vw; height:70vh; opacity:0; transition:opacity 1.2s; pointer-events:none;
    background:radial-gradient(ellipse at 70% 30%, rgba(40,255,140,.16), rgba(0,160,80,.05) 45%, transparent 70%); }
  #exitsign { position:absolute; top:26px; right:30px; width:min(230px, 42vw); padding:0; border:0; background:none; cursor:default; opacity:0; }
  #exitsign svg { width:100%; display:block; }
  #exitsign.flash { opacity:1; filter:drop-shadow(0 0 10px rgba(30,255,130,.6)); }
  #exitsign.lit { opacity:1; cursor:pointer; filter:drop-shadow(0 0 14px rgba(30,255,130,.7)) drop-shadow(0 0 46px rgba(0,210,100,.45)); animation:hum 3.4s ease-in-out infinite; }
  #exitsign.lit:focus-visible { outline:3px dashed #9fffc8; outline-offset:8px; }
  @keyframes hum { 0%,100% { opacity:1; } 48% { opacity:.94; } 50% { opacity:.84; } 52% { opacity:1; } }

  /* ---------- thank you ---------- */
  #thanks { display:none; place-items:center; text-align:center; background:var(--paper); z-index:59; padding:24px; }
  #thanks h1 { font-size:clamp(34px, 6vw, 78px); font-weight:700; letter-spacing:-.02em; line-height:1.04; max-width:15ch; margin:0 auto; }
  #thanks .dance { position:relative; height:min(40vh, 330px); aspect-ratio:1; margin:6px auto 4px; }
  #thanks .note { position:absolute; font-size:30px; color:#1b1b1b; opacity:0; animation:note 2.6s ease-out infinite; }
  @keyframes note { 0% { opacity:0; transform:translate(0,10px) rotate(-8deg); } 20% { opacity:.9; } 100% { opacity:0; transform:translate(var(--dx,30px),-110px) rotate(14deg); } }
  #thanks .restart { margin-top:6px; }

  /* ---------- express (pdf click-through, unchanged) ---------- */
  #xview { display:none; background:#efede8; }

<script>
/* ============================================================
   helpers
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
const INK = '#161616';
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const R = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, str, a = {}) {
  const t = el('text', { x, y, fill: INK, 'font-family': SANS, ...a }, parent);
  t.textContent = str; return t;
}
function tween(dur, fn, ease = t => t) {
  return new Promise(res => {
    const t0 = performance.now();
    function f(now) {
      const p = Math.min(1, (now - t0) / dur);
      fn(ease(p), p);
      if (p < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}

/* ---------- architect's-pen helpers: loose, overshooting, multi-pass ---------- */
function segD(x1, y1, x2, y2, j) {
  // gestural cubic: two loose control points so strokes bow and drift
  const c1x = lerp(x1, x2, .33) + R(-j * 2.2, j * 2.2), c1y = lerp(y1, y2, .33) + R(-j * 2.2, j * 2.2);
  const c2x = lerp(x1, x2, .66) + R(-j * 2.2, j * 2.2), c2y = lerp(y1, y2, .66) + R(-j * 2.2, j * 2.2);
  return `M${(x1 + R(-j, j)).toFixed(1)} ${(y1 + R(-j, j)).toFixed(1)} C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${(x2 + R(-j, j)).toFixed(1)} ${(y2 + R(-j, j)).toFixed(1)} `;
}
function sLine(p, x1, y1, x2, y2, o = {}) {
  const passes = o.passes ?? 3, j = o.j ?? 4, os = o.over ?? 30;
  const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const g = el('g', {}, p);
  for (let i = 0; i < passes; i++) {
    const a = R(-os * .3, os), b = R(-os * .3, os);   // overshoot (or stop short) at the corners
    const sx = x1 - ux * a, sy = y1 - uy * a, ex = x2 + ux * b, ey = y2 + uy * b;
    let d;
    if (os > 0 && L > 60 && Math.random() < .4) {        // broken stroke: pen lifts mid-line
      const t1 = R(.3, .55), t2 = t1 + R(.06, .2);
      d = segD(sx, sy, lerp(sx, ex, t1), lerp(sy, ey, t1), j) + segD(lerp(sx, ex, t2), lerp(sy, ey, t2), ex, ey, j);
    } else d = segD(sx, sy, ex, ey, j);
    el('path', { d, fill: 'none', stroke: o.stroke || INK, 'stroke-width': ((o.w || 1.7) * (i ? R(.4, 1) : 1)).toFixed(2),
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: o.op ?? R(.7, .95) }, g);
  }
  return g;
}
function scribble(p, cx, cy, rx, ry, n = 30, w = 1.2) {   // loose abstract scribble mass
  let x = cx + R(-rx, rx), y = cy + R(-ry, ry), d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const nx = cx + R(-rx, rx), ny = cy + R(-ry, ry);
    d += ` Q${(x + R(-rx, rx) * .6).toFixed(1)} ${(y + R(-ry, ry) * .6).toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)}`;
    x = nx; y = ny;
  }
  el('path', { d, fill: 'none', stroke: INK, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: R(.45, .8) }, p);
}
function sPoly(p, pts, closed = true, o = {}) {
  const g = el('g', {}, p);
  for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    sLine(g, a[0], a[1], b[0], b[1], o);
  }
  return g;
}
const sRect = (p, x, y, w, h, o) => sPoly(p, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true, o);
function sEllipse(p, cx, cy, rx, ry, o = {}) {
  let d = '';
  const passes = o.passes ?? 3, wob = o.wob ?? .12;
  for (let k = 0; k < passes; k++) {
    const a0 = R(0, Math.PI * 2), span = Math.PI * 2 * R(1.03, 1.3), ph = R(0, 6), n = 44;
    for (let i = 0; i <= n; i++) {
      const a = a0 + span * i / n, f = 1 + wob * Math.sin(a * 2 + ph);
      d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rx * f).toFixed(1) + ' ' + (cy + Math.sin(a) * ry * f).toFixed(1) + ' ';
    }
  }
  return el('path', { d, fill: o.fill || 'none', stroke: o.stroke || INK, 'stroke-width': o.w || 1.7,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p);
}
function hatch(p, x, y, w, h, o = {}) {      // diagonal shadow hatching
  const id = 'c' + Math.random().toString(36).slice(2);
  el('rect', { x, y, width: w, height: h }, el('clipPath', { id }, defs));
  const g = el('g', { 'clip-path': `url(#${id})` }, p), gap = o.gap || 7;
  for (let t = -h; t < w; t += gap * R(.6, 1.6)) {
    if (Math.random() < .15) continue;                 // skipped strokes
    sLine(g, x + t, y + h, x + t + h * R(.7, 1.2), y, { passes: 1, j: 2.5, over: 10, w: o.w || 1, op: o.op ?? .8 });
  }
}
function palm(p, x, base, h, w) {           // scratchy zig-zag tree like the reference
  sLine(p, x, base, x + R(-8, 8), base - h * .62, { passes: 2, w: 1.5, over: 4 });
  const top = base - h, bot = base - h * .5;
  for (let k = 0; k < 2; k++) {
    let d = `M${x + R(-4, 4)} ${top}`, y = top, side = 1;
    while (y < bot) {
      y += R(5, 11);
      const ww = w * (.35 + .65 * Math.sin(Math.PI * (y - top) / (bot - top)));
      d += ` L${(x + side * ww * R(.55, 1)).toFixed(1)} ${y.toFixed(1)}`;
      side *= -1;
    }
    el('path', { d, fill: 'none', stroke: INK, 'stroke-width': k ? .9 : 1.4, 'stroke-linejoin': 'round', opacity: .9 }, p);
  }
}
function waterStrokes(p, x0, x1, y0, y1, n) {  // horizontal reflection strokes
  for (let i = 0; i < n; i++) {
    const y = R(y0, y1), x = R(x0, x1), len = R(20, 160) * (1 - (y - y0) / (y1 - y0) * .5);
    sLine(p, x, y, x + len, y + R(-5, 5), { passes: R(1, 2.5) | 0, j: 2.5, over: 12, w: R(.8, 2.6), op: R(.45, .95) });
  }
}

/* ============================================================
   SCENE 1 — build the drawing
   ============================================================ */
const svg = document.getElementById('s1svg');
const defs = document.getElementById('defs');
const D = document.getElementById('drawing');
const UI = document.getElementById('ui');
const turb = document.getElementById('turb');

/* sheet typography (crisp, like a presentation board) */
txt(UI, 180, 92, 'PORTFOLIO', { 'font-size': 15, 'font-weight': 700, 'letter-spacing': 2 });
txt(UI, 180, 150, 'Welcome to My World', { 'font-size': 54, 'font-weight': 700, 'letter-spacing': -.5 });
txt(UI, 182, 186, 'An interactive portfolio. Enter at your own risk.', { 'font-size': 18, fill: '#444' });
txt(UI, 180, 872, 'YOUR NAME · STUDIO', { 'font-size': 12, 'letter-spacing': 1.5, fill: '#444' });
txt(UI, 1398, 872, '11-2026', { 'font-size': 13, fill: '#444' });

/* landscape behind */
el('path', { d: 'M150 704 Q250 650 370 702 M330 706 Q420 668 480 706', fill: 'none', stroke: INK, 'stroke-width': 1.3, opacity: .8 }, D);
sLine(D, 140, 706, 460, 705, { passes: 1, w: 1.1, over: 20 });
sLine(D, 1150, 706, 1570, 704, { passes: 1, w: 1.1, over: 20 });
el('path', { d: 'M1340 704 Q1420 676 1500 703', fill: 'none', stroke: INK, 'stroke-width': 1.2, opacity: .75 }, D);

/* abstract gestures: scribble masses + stray strokes (kept clear of title, buttons and the guy) */
scribble(D, 300, 640, 110, 45, 26, 1.1);
scribble(D, 1065, 290, 70, 26, 18, 1);
scribble(D, 560, 815, 160, 22, 30, 1.3);
scribble(D, 1490, 720, 70, 22, 16, 1);
scribble(D, 230, 420, 40, 90, 14, .9);
scribble(D, 1010, 712, 60, 30, 14, 1.2);
for (let i = 0; i < 14; i++) {                         // flying strokes
  const zones = [[180, 260, 470, 600], [440, 220, 1150, 290], [180, 780, 1000, 860], [1250, 640, 1580, 700]];
  const [x0, y0, x1, y1] = zones[i % zones.length];
  const x = R(x0, x1), y = R(y0, y1), a = R(-.5, .5), L = R(40, 180);
  sLine(D, x, y, x + Math.cos(a) * L, y + Math.sin(a) * L, { passes: 1, j: 6, over: 0, w: R(.6, 1.6), op: R(.35, .7) });
}

/* palms (behind the roof + left) */
palm(D, 640, 340, 190, 26);
palm(D, 965, 340, 150, 22);
palm(D, 380, 760, 300, 30);

/* pavilion: floating flat roof, thin columns, glass */
sLine(D, 450, 328, 1150, 328, { w: 2.4, over: 26 });
sLine(D, 450, 348, 1150, 348, { w: 2, over: 26 });
sLine(D, 450, 328, 450, 348, { w: 1.6, over: 4 });
sLine(D, 1150, 328, 1150, 348, { w: 1.6, over: 4 });
sLine(D, 450, 328, 520, 298, { w: 1.1, over: 6 });
sLine(D, 1150, 328, 1088, 298, { w: 1.1, over: 6 });
sLine(D, 520, 298, 1088, 298, { w: 1.1, over: 16 });
sLine(D, 480, 348, 480, 760, { w: 1.8, over: 6 });
sLine(D, 1120, 348, 1120, 760, { w: 1.8, over: 6 });
sLine(D, 560, 348, 560, 760, { w: 1.6, over: 4 });
sLine(D, 1040, 348, 1040, 760, { w: 1.6, over: 4 });
for (const x of [648, 990]) sLine(D, x, 348, x, 760, { w: 1.1, over: 4, passes: 1 });
hatch(D, 560, 349, 480, 34, { gap: 6, op: .75 });                     // shadow under the overhang
// glass reflections: clusters of vertical strokes
for (const [a, b] of [[562, 646], [650, 730], [992, 1038]]) {
  const n = (R(6, 12)) | 0;
  for (let i = 0; i < n; i++) {
    const x = R(a + 4, b - 4), y0 = R(390, 470), y1 = R(560, 756);
    sLine(D, x, y0, x + R(-2, 2), y1, { passes: 1, j: 1, over: 0, w: R(.6, 1.3), op: R(.5, .9) });
  }
}

/* the dark opening — something is watching */
el('rect', { x: 880, y: 392, width: 104, height: 100, fill: '#1f1f1f' }, D);
sRect(D, 878, 390, 108, 104, { w: 1.6, over: 6 });
const eyes = [];
for (const ex of [916, 948]) {
  const white = el('ellipse', { cx: ex, cy: 440, rx: 8, ry: 8, fill: '#fff' }, D);
  const pupil = el('circle', { cx: ex, cy: 440, r: 3.6, fill: INK }, D);
  eyes.push({ ex, ey: 440, white, pupil });
}

/* doorway: the mind peeking through */
const doorway = el('rect', { x: 740, y: 560, width: 120, height: 200, fill: '#0b0b10' }, D);
const doorItems = el('g', { 'clip-path': 'url(#doorClip)' }, D);
const peeks = [];
['#e4572e', '#4ea5d9', '#ffd166', '#9bc53d', '#ffffff', '#c084fc'].forEach(c => {
  const s = R(8, 18);
  const r = el('rect', { width: s, height: s, fill: c }, doorItems);
  peeks.push({ r, bx: R(750, 845), by: R(575, 740), ph: R(0, 6), s });
});
for (let i = 0; i < 14; i++) el('circle', { cx: R(742, 858), cy: R(562, 758), r: R(.6, 1.6), fill: '#fff', opacity: R(.3, .8) }, doorItems);
sRect(D, 732, 552, 136, 208, { w: 2, over: 10 });                     // door frame
const doorPanel = el('g', {}, D);

const DX = 740, DY = 560, DW = 120, DH = 200;
function doorQuad(th) {
  const xr = DX + DW * Math.cos(th), d = 22 * Math.sin(th);
  return [[DX, DY], [xr, DY - d], [xr, DY + DH + d], [DX, DY + DH]];
}
function bil(q, u, v) {
  const top = [lerp(q[0][0], q[1][0], u), lerp(q[0][1], q[1][1], u)];
  const bot = [lerp(q[3][0], q[2][0], u), lerp(q[3][1], q[2][1], u)];
  return [lerp(top[0], bot[0], v), lerp(top[1], bot[1], v)];
}
const quadPath = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z';
const doorStreaks = Array.from({ length: 6 }, () => [R(.12, .88), R(.05, .3), R(.6, .95)]);
function drawDoor(th) {
  while (doorPanel.firstChild) doorPanel.firstChild.remove();
  const q = doorQuad(th);
  el('path', { d: quadPath(q), fill: '#fdfdfb', stroke: INK, 'stroke-width': 1.9, 'stroke-linejoin': 'round' }, doorPanel);
  el('path', { d: quadPath(q.map(p => [p[0] + 1.4, p[1] - 1.1])), fill: 'none', stroke: INK, 'stroke-width': 1, opacity: .6 }, doorPanel);
  for (const [u, v0, v1] of doorStreaks) {                           // loose vertical grain strokes
    const a = bil(q, u, v0), b = bil(q, u, v1);
    el('path', { d: `M${a[0].toFixed(1)} ${a[1].toFixed(1)} L${b[0].toFixed(1)} ${b[1].toFixed(1)}`, stroke: INK, 'stroke-width': .9, opacity: .55 }, doorPanel);
  }
  const k1 = bil(q, .84, .44), k2 = bil(q, .84, .58);
  el('path', { d: `M${k1[0].toFixed(1)} ${k1[1].toFixed(1)} L${k2[0].toFixed(1)} ${k2[1].toFixed(1)}`, stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round' }, doorPanel);
}

/* To use a real image on a card, add  img: 'images/your-file.jpg'  to its entry. */
function makeCard(d, extra = '') {
  const c = document.createElement('div');
  c.className = 'card ' + d.c + ' ' + extra;
  c.style.width = d.w + 'px'; c.style.height = d.h + 'px';
  c.style.marginLeft = -d.w / 2 + 'px'; c.style.marginTop = -d.h / 2 + 'px';
  c.innerHTML = d.html;
  if (d.album) c.style.background = `hsl(${(R(0, 360)) | 0} 50% 42%)`;
  if (d.img) { c.style.backgroundImage = `url("${d.img}")`; c.style.backgroundSize = 'cover'; c.style.backgroundPosition = 'center'; }
  return c;
}
// where the hanging guy's hands sit on a card (card centre + offsets)
const anchor = c => ({ x: c.x + c.w * .08 + 30, y: c.y + c.h / 2 - 3, z: c.z });
function spawn() {
  let x = R(-1500, 1500), y = R(-900, 900);
  if (Math.abs(x) < 360 && Math.abs(y) < 280) x += (x < 0 ? -1 : 1) * 420;
  return { x, y, ry: R(-35, 35), rz: R(-25, 25), vr: R(-.006, .006) };
}

let voidRunning = false;
function showVoid() {
  state = 'void';
  document.getElementById('scene1').style.display = 'none';
  document.getElementById('void').style.display = 'block';
  voidRunning = true;

  const space = document.getElementById('space');
  const hint = document.getElementById('hint');
  const items = [];
  for (let i = 0; i < 26; i++) {
    const c = makeCard(CARD_DEFS[i % CARD_DEFS.length]);
    space.appendChild(c);
    items.push({ el: c, ...spawn(), z: R(-4200, -1400) });
  }
  const F = { el: makeCard({ c: 'project', w: 260, h: 330,
      html: '<span class="tag">project 01</span><div class="ph" style="background:url(11-background-living-room.png) center/cover"></div><b class="ttl">Ledger Residence</b>' + HANGER_OFF }, 'featured'),
    x: -460, y: -240, z: -2200, ry: 25, rz: -12, w: 260, h: 330, mode: 'drift' };
  space.appendChild(F.el);

  // the textile he's clinging to at first (background detail)
  const T = { el: makeCard({ c: 'textile', w: 190, h: 190, html: '<span class="tag light">textile</span>' + HANGER }),
    x: -110, y: -420, z: -1900, ry: 10, rz: -6, w: 190, h: 190, mode: 'drift', fade: 1 };
  space.appendChild(T.el);

  // a free-flying copy of him, used only for the leap between cards
  const J = { el: document.createElement('div'), x: 0, y: 0, z: 0, rot: 0, on: false };
  J.el.className = 'jumper';
  J.el.innerHTML = `<svg ${SVG_OPEN}>${GUY_INNER}</svg>`;
  space.appendChild(J.el);

  let last = performance.now(), t = 0;
  const tStart = last;
  function frame(now) {
    const dt = Math.min(50, now - last); last = now; t += dt / 1000;
    const burst = 1 + 6 * Math.max(0, 1 - (now - tStart) / 1600);
    for (const it of items) {
      it.z += dt * .12 * burst; it.rz += it.vr * dt;
      if (it.z > 700) Object.assign(it, spawn(), { z: -4200 });
      it.el.style.opacity = clamp((it.z + 4200) / 1400) * clamp((800 - it.z) / 400);
      it.el.style.transform = `translate3d(${it.x}px,${it.y}px,${it.z}px) rotateY(${it.ry}deg) rotateZ(${it.rz}deg)`;
    }
    if (F.mode === 'drift') F.z += dt * .05 * burst;
    const hold = F.mode === 'hold';
    F.el.style.opacity = F.mode === 'drift' ? clamp((F.z + 4200) / 1400) : 1;
    F.el.style.transform = `translate3d(${F.x}px,${F.y + (hold ? Math.sin(t * 1.6) * 8 : 0)}px,${F.z}px) rotateY(${F.ry}deg) rotateZ(${F.rz + (hold ? Math.sin(t * 1.1) * 1.5 : 0)}deg)`;

    if (T.mode === 'drift') T.z += dt * .05 * burst;
    T.el.style.opacity = clamp((T.z + 4200) / 1400) * T.fade;
    T.el.style.transform = `translate3d(${T.x}px,${T.y}px,${T.z}px) rotateY(${T.ry}deg) rotateZ(${T.rz}deg)`;

    if (J.on) J.el.style.transform = `translate3d(${J.x}px,${J.y}px,${J.z}px) rotate(${J.rot}deg)`;
    if (voidRunning) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(async () => {
    F.mode = 'approach';
    const s = { ...F };
    const approach = tween(3200, e => {
      F.x = lerp(s.x, 0, e); F.y = lerp(s.y, -30, e); F.z = lerp(s.z, 180, e);
      F.ry = lerp(s.ry, 0, e); F.rz = lerp(s.rz, 0, e);
    }, easeInOut);

    // mid-approach: he lets go of the textile and leaps onto Project 01
    await sleep(900);
    T.el.querySelector('.hanger').classList.add('off');
    J.on = true; J.el.style.display = 'block';
    await tween(1300, (e, p) => {
      const a = anchor(T), b = anchor(F);
      J.x = lerp(a.x, b.x, e);
      J.y = lerp(a.y, b.y, e) - Math.sin(p * Math.PI) * 220;   // arc through the air
      J.z = lerp(a.z, b.z, e);
      J.rot = Math.sin(p * Math.PI * 3) * 25;                   // flailing
    }, easeInOut);
    J.on = false; J.el.style.display = 'none';
    F.el.querySelector('.hanger').classList.remove('off');

    // the abandoned textile drifts away into the dark
    T.mode = 'flee';
    const ts = { ...T };
    tween(2600, e => {
      T.x = lerp(ts.x, ts.x - 900, e); T.y = lerp(ts.y, ts.y - 500, e);
      T.z = lerp(ts.z, ts.z - 1600, e); T.rz = lerp(ts.rz, ts.rz - 120, e); T.fade = 1 - e;
    }, easeIn);

    await approach;
    F.mode = 'hold';
    hint.classList.add('show');
    F.el.addEventListener('click', () => enterProject(F, hint), { once: true });
  }, 2600);
}

async function enterProject(F, hint) {

  document.getElementById('void').style.display = 'none';
  showWorld(0);
}

function mk(tag, a = {}, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
function div(cls, parent, css = {}) { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); parent.appendChild(d); return d; }
function ik(h, f, l1, l2, s) {               // two-bone joint: where the knee/elbow goes
  const dx = f[0] - h[0], dy = f[1] - h[1], d = Math.hypot(dx, dy) || 1e-6, ux = dx / d, uy = dy / d;
  if (d >= l1 + l2 - .01) return [h[0] + ux * l1, h[1] + uy * l1];
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), hh = Math.sqrt(Math.max(0, l1 * l1 - a * a)), sg = s >= 0 ? 1 : -1;
  return [h[0] + ux * a - uy * hh * sg, h[1] + uy * a + ux * hh * sg];
}

/* ---------------------------------------------------------------------
   THE STICK MAN — one drawing, posed differently in each scene.
   Transparent head and body, thin outline.
   --------------------------------------------------------------------- */
const STAND = { hx: 0, hy: -72, t: 0, nk: 0, flx: -25, fly: 0, frx: 25, fry: 0, kl: 1, kr: -1,
  lu: -28, lf: -28, ru: 28, rf: 28, ex: 0, ey: 0, smile: 0, blink: 0, wig: 0, sway: 0, spark: 0 };

class Stick {
  constructor(parent, o = {}) {
    const w = this.wrap = document.createElement('div'); w.className = 'stick';
    if (o.color) w.style.setProperty('--sc', o.color);
    const s = mk('svg', { viewBox: '-130 -270 260 290', 'aria-hidden': 'true' }); w.appendChild(s);
    const g = mk('g', {}, s);
    this.legL = mk('path', { class: 'ln' }, g); this.legR = mk('path', { class: 'ln' }, g);
    this.torso = mk('path', { class: 'ln' }, g);
    this.scarf = mk('g', { style: 'display:none' }, g);
    this.sc2 = mk('path', { class: 'sc2' }, this.scarf); this.sc1 = mk('path', { class: 'sc1' }, this.scarf);
    this.headG = mk('g', {}, g);
    mk('circle', { class: 'ln', cx: 0, cy: 0, r: 38 }, this.headG);
    this.eyeL = mk('ellipse', { class: 'eye', rx: 4.6, ry: 4.6 }, this.headG);
    this.eyeR = mk('ellipse', { class: 'eye', rx: 4.6, ry: 4.6 }, this.headG);
    this.mouth = mk('path', { class: 'ln', style: 'stroke-width:4' }, this.headG);
    this.glasses = mk('path', { class: 'ln thin', style: 'display:none' }, this.headG);
    this.armL = mk('path', { class: 'ln' }, g);
    this.clip = mk('g', { style: 'display:none' }, g);
    mk('rect', { class: 'cbBoard', x: -22, y: -46, width: 44, height: 56, rx: 3 }, this.clip);
    mk('rect', { class: 'cbPaper', x: -17, y: -38, width: 34, height: 43 }, this.clip);
    mk('rect', { class: 'cbClip', x: -9, y: -51, width: 18, height: 9, rx: 2 }, this.clip);
    for (let i = 0; i < 4; i++) mk('path', { class: 'cbLine', d: `M-12 ${-29 + i * 9} L${i % 2 ? 4 : 11} ${-29 + i * 9}` }, this.clip);
    this.armR = mk('path', { class: 'ln' }, g);
    this.pen = mk('path', { class: 'ln thin', style: 'display:none;stroke-width:3.4' }, g);
    this.fingers = mk('path', { class: 'ln thin', style: 'display:none;stroke-width:3.2' }, g);
    this.spark = mk('path', { class: 'ln spark', opacity: 0 }, g);
    this.p = { ...STAND }; this.add = {}; this.pos = { x: 0, y: 0, h: .2 };
    this.handL = null; this.handR = null; this.cbAngle = 0; this.onTick = null;
    this.hL = [0, -209]; this.hR = [0, -209];
    this.alive = true; this.nextBlink = performance.now() + 1500; this.blinkAt = -1e9;
    parent.appendChild(w);
    this._loop = this.loop.bind(this); requestAnimationFrame(this._loop);
  }
  show(part, on = true) { this[part].style.display = on ? '' : 'none'; }
  v(k) { return this.p[k] + (this.add[k] || 0); }
  place(x, y, h) {
    Object.assign(this.pos, { x, y, h });
    const st = this.wrap.style; st.left = x * 100 + '%'; st.top = y * 100 + '%'; st.height = (h * 290 / 238 * 100) + '%';
  }
  dims() { const c = this.wrap.parentElement; return { W: c.clientWidth, H: c.clientHeight }; }
  unit() { return this.pos.h * this.dims().H / 238; }
  toLocal(fx, fy) { const { W, H } = this.dims(), u = this.unit(); return [(fx - this.pos.x) * W / u, (fy - this.pos.y) * H / u]; }
  shoulder() { const t = this.v('t') * D2R; return [this.v('hx') + Math.sin(t) * 65, this.v('hy') - Math.cos(t) * 65]; }
  angleTo(fx, fy) { const [tx, ty] = this.toLocal(fx, fy), [sx, sy] = this.shoulder(); return Math.atan2(tx - sx, ty - sy) / D2R; }
  poseTo(target, dur, ease = easeInOut) {
    const s = {}; for (const k in target) s[k] = this.p[k];
    return tween(dur, e => { for (const k in target) this.p[k] = lerp(s[k], target[k], e); }, ease);
  }
  async walkTo(x, y, h, dur) {
    const s = { ...this.pos }, dir = Math.sign(x - s.x) || 1, n = Math.max(2, Math.round(dur / 330));
    await tween(dur, (e, p) => {
      this.place(lerp(s.x, x, e), lerp(s.y, y, e), lerp(s.h, h, e));
      const ph = p * n * Math.PI, env = Math.min(1, p * 6, (1 - p) * 6), c = Math.cos(ph), sn = Math.sin(ph);
      Object.assign(this.add, { flx: -dir * 12 * c * env, frx: dir * 12 * c * env,
        fly: -9 * Math.max(0, sn) * env, fry: -9 * Math.max(0, -sn) * env,
        hy: -3 * Math.abs(sn) * env, lu: 20 * c * env, ru: 20 * c * env });
    }, easeInOut);
    for (const k of ['flx', 'frx', 'fly', 'fry', 'hy', 'lu', 'ru']) this.add[k] = 0;
  }
  loop(now) {
    if (!this.alive) return;
    if (now > this.nextBlink) { this.blinkAt = now; this.nextBlink = now + R(2400, 5200); }
    this.add.blink = (now - this.blinkAt) < 140 ? 1 : 0;
    if (this.onTick) this.onTick(now / 1000, this);
    this.draw(now / 1000);
    requestAnimationFrame(this._loop);
  }
  draw(t) {
    const v = k => this.v(k);
    const tl = v('t') * D2R, up = [Math.sin(tl), -Math.cos(tl)], hip = [v('hx'), v('hy')];
    const at = d => [hip[0] + up[0] * d, hip[1] + up[1] * d];
    const neck = at(92), sh = at(65), ha = v('t') + v('nk');
    const hc = [neck[0] + Math.sin(ha * D2R) * 38, neck[1] - Math.cos(ha * D2R) * 38];
    const L = 38.2, fL = [v('flx'), v('fly')], fR = [v('frx'), v('fry')];
    this.legL.setAttribute('d', `M${P(hip)} L${P(ik(hip, fL, L, L, v('kl')))} L${P(fL)}`);
    this.legR.setAttribute('d', `M${P(hip)} L${P(ik(hip, fR, L, L, v('kr')))} L${P(fR)}`);
    this.torso.setAttribute('d', `M${P(hip)} L${P(neck)}`);
    const arm = (tgt, ku, kf, sg) => {
      if (tgt) {
        const d = Math.hypot(tgt[0] - sh[0], tgt[1] - sh[1]);
        const hd = d > 72 ? [sh[0] + (tgt[0] - sh[0]) / d * 72, sh[1] + (tgt[1] - sh[1]) / d * 72] : tgt;
        return [ik(sh, hd, 36, 36, sg), hd];
      }
      const u = dirv(v(ku)), f = dirv(v(kf)), el = [sh[0] + u[0] * 36, sh[1] + u[1] * 36];
      return [el, [el[0] + f[0] * 36, el[1] + f[1] * 36]];
    };
    const [eL, hL] = arm(this.handL, 'lu', 'lf', 1), [eR, hR] = arm(this.handR, 'ru', 'rf', -1);
    this.hL = hL; this.hR = hR;
    this.armL.setAttribute('d', `M${P(sh)} L${P(eL)} L${P(hL)}`);
    this.armR.setAttribute('d', `M${P(sh)} L${P(eR)} L${P(hR)}`);
    // head: transparent circle, dot eyes, line mouth
    this.headG.setAttribute('transform', `translate(${P(hc)}) rotate(${ha.toFixed(1)})`);
    const ex = v('ex'), ey = v('ey'), bl = clamp(v('blink'), 0, 1), ry = 4.6 * (1 - .9 * bl);
    const exL = -13 + ex * 7, exR = 13 + ex * 7, eyY = -10 + ey * 5;
    for (const [e, x] of [[this.eyeL, exL], [this.eyeR, exR]]) { e.setAttribute('cx', x.toFixed(1)); e.setAttribute('cy', eyY.toFixed(1)); e.setAttribute('ry', ry.toFixed(1)); }
    const mx = ex * 5, sm = v('smile');
    this.mouth.setAttribute('d', `M${(-13 + mx).toFixed(1)} 16 Q${mx.toFixed(1)} ${(16 + sm * 11).toFixed(1)} ${(13 + mx).toFixed(1)} 16`);
    if (this.glasses.style.display !== 'none') {
      const r = 10.5, c = (x) => `M${(x - r).toFixed(1)} ${eyY.toFixed(1)} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0`;
      this.glasses.setAttribute('d', `${c(exL)} ${c(exR)} M${(exL + r).toFixed(1)} ${eyY.toFixed(1)} L${(exR - r).toFixed(1)} ${eyY.toFixed(1)} M${(exL - r).toFixed(1)} ${eyY.toFixed(1)} L-37 ${(eyY - 4).toFixed(1)} M${(exR + r).toFixed(1)} ${eyY.toFixed(1)} L37 ${(eyY - 4).toFixed(1)}`);
    }
    if (this.scarf.style.display !== 'none') {
      const n2 = at(84), sw = Math.sin(t * 1.7) * 5 + v('sway');
      this.sc1.setAttribute('d', `M${P([n2[0] - 17, n2[1] - 3])} Q${P([n2[0], n2[1] + 13])} ${P([n2[0] + 17, n2[1] - 3])}`);
      this.sc2.setAttribute('d', `M${P([n2[0] + 7, n2[1] + 6])} Q${P([n2[0] + 17 - sw * .4, n2[1] + 30])} ${P([n2[0] + 12 + sw, n2[1] + 54])}`);
    }
    if (this.clip.style.display !== 'none') this.clip.setAttribute('transform', `translate(${P(hL)}) rotate(${this.cbAngle})`);
    if (this.pen.style.display !== 'none') this.pen.setAttribute('d', `M${P(hR)} l-7 -15`);
    if (this.fingers.style.display !== 'none') {
      let d = '';
      for (const [el, hd, k] of [[eL, hL, 0], [eR, hR, 2]]) {
        const a = Math.atan2(hd[0] - el[0], hd[1] - el[1]);
        for (let i = -1; i <= 1; i++) {
          const b = a + (i * 32 + v('wig') * 14 * Math.sin(t * 9 + i * 1.7 + k)) * D2R;
          d += `M${P(hd)} L${P([hd[0] + Math.sin(b) * 11, hd[1] + Math.cos(b) * 11])} `;
        }
      }
      this.fingers.setAttribute('d', d);
    }
    const sp = v('spark');
    this.spark.setAttribute('opacity', sp.toFixed(2));
    if (sp > 0) {
      let d = '';
      for (let i = 0; i < 6; i++) { const a = i / 6 * 2 * Math.PI; d += `M${P([hR[0] + Math.cos(a) * 9, hR[1] + Math.sin(a) * 9])} L${P([hR[0] + Math.cos(a) * 19, hR[1] + Math.sin(a) * 19])} `; }
      this.spark.setAttribute('d', d);
    }
  }
  destroy() { this.alive = false; this.wrap.remove(); }
}

/* ---------------------------------------------------------------------
   WORLD ENGINE
   --------------------------------------------------------------------- */
const worldEl = $('world'), cam = $('cam'), stage = $('stage'), wbg = $('wbg'), props = $('props');
const hotspot = $('hotspot'), panel = $('panel'), pill = $('pill'), wfade = $('wfade');
const W = { i: -1, step: 0, phase: 'off', cfg: null, tok: 0, stick: null, lay: null, rush: false, seqs: [] };
const alive = tok => tok === W.tok;
const D = ms => W.rush ? ms * .2 : ms;
const nap = ms => new Promise(r => { const t0 = performance.now(); const f = () => (W.rush || performance.now() - t0 >= ms) ? r() : requestAnimationFrame(f); f(); });
const busy = () => W.phase === 'boards' || W.phase === 'explore';
const run = fn => { const p = fn(); W.seqs.push(p); return p; };

function layoutStage() {
  const c = W.cfg; if (!c) return;
  const vw = innerWidth, vh = innerHeight, mobile = vw <= 760;
  let w = Math.max(vw, vh * c.ar), h = w / c.ar;
  if (h < vh) { h = vh; w = h * c.ar; }
  const [x0, y0, x1, y1] = c.view;
  let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  if (mobile) {
    [cx, cy] = c.mfocus || [cx, cy];
    let z = 1;
    while (z < 1.35 && vh * .26 - cy * h * z < vh - h * z) z += .05;
    w *= z; h *= z;
  }
  const free = mobile ? vw : vw - panel.offsetWidth - 48;        // keep the action clear of the board panel
  const left = clamp(free / 2 - cx * w, vw - w, 0);
  const top = clamp((mobile ? vh * .26 : vh / 2) - cy * h, vh - h, 0);
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: left + 'px', top: top + 'px' });
  W.lay = { w, h, left, top };
  if (c.relayout) c.relayout(W.lay);
}
addEventListener('resize', layoutStage);

function camTo(fx, fy, S, dur, o = {}) {
  const L = W.lay, C = { x: L.left + fx * L.w, y: L.top + fy * L.h }, M = { x: innerWidth / 2, y: innerHeight / 2 };
  return tween(dur, (e, p) => {
    const s = Math.pow(S, e), k = easeInOut(p);
    const lx = C.x + (M.x - C.x) * k, ly = C.y + (M.y - C.y) * k + (o.bob ? Math.sin(p * Math.PI * 5) * 6 * (1 - p) : 0);
    cam.style.transform = `translate(${lx - s * C.x}px, ${ly - s * C.y}px) scale(${s})`;
    if (o.blur) cam.style.filter = `blur(${(clamp((p - .55) / .45) * o.blur).toFixed(2)}px)`;
    if (o.each) o.each(p, e);
  }, easeIn);
}

/* boards panel */
function renderBoard() {
  const c = W.cfg, b = c.boards[W.step], n = c.boards.length;
  $('pinner').innerHTML = `<div class="proj">${c.title}</div><h3>${b.title}</h3>
    <figure class="board" data-src="${b.src}" data-cap="${b.title}"><img src="${b.src}" alt="${b.title}"><span class="zoom">⤢ Enlarge</span></figure>
    ${b.text ? `<p>${b.text}</p>` : ''}`;
  $('pinner').scrollTop = 0;
  $('pcount').textContent = `${W.step + 1} / ${n}`;
  $('pprev').disabled = W.step === 0;
  $('pnext').textContent = W.step === n - 1 ? 'Continue →' : 'Next →';
}
function openPanel() { panel.classList.add('open'); pill.style.display = 'none'; }
function closePanel(showPill = true) { panel.classList.remove('open'); pill.style.display = showPill ? 'block' : 'none'; }
$('pnext').onclick = () => { if (W.step < W.cfg.boards.length - 1) { W.step++; renderBoard(); } else finishBoards(); };
$('pprev').onclick = () => { if (W.step > 0) { W.step--; renderBoard(); } };
$('pmin').onclick = () => closePanel(true);
pill.onclick = () => openPanel();
$('pinner').addEventListener('click', e => {
  const f = e.target.closest('figure'); if (!f) return;
  $('lbimg').src = f.dataset.src; $('lbimg').alt = f.dataset.cap; $('lbcap').textContent = f.dataset.cap;
  $('lightbox').classList.add('open');
});
$('lightbox').onclick = () => $('lightbox').classList.remove('open');
addEventListener('keydown', e => {
  if (e.key === 'Escape') $('lightbox').classList.remove('open');
  if (W.phase === 'boards' && panel.classList.contains('open') && !$('lightbox').classList.contains('open')) {
    if (e.key === 'ArrowRight') $('pnext').click();
    if (e.key === 'ArrowLeft') $('pprev').click();
  }
});

function finishBoards() {
  if (W.phase !== 'boards') return;
  closePanel(true);
  W.phase = 'explore';
  hotspot.classList.add('on');
  if (W.cfg.onExplore) run(() => W.cfg.onExplore(W.tok));
}

hotspot.addEventListener('click', async () => {
  if (W.phase !== 'explore') return;
  W.phase = 'leaving';
  hotspot.classList.remove('on');
  closePanel(false);
  W.rush = true;                                   // let any running animation finish quickly
  await Promise.all(W.seqs);
  W.rush = false;
  await W.cfg.leave(W.tok);
});

async function showWorld(i, o = {}) {
  const c = WORLDS[i], tok = ++W.tok;
  Object.assign(W, { i, cfg: c, step: 0, phase: 'intro', rush: false, seqs: [] });
  if (W.stick) { W.stick.destroy(); W.stick = null; }
  props.innerHTML = '';
  worldEl.className = 'scene s-' + c.style;
  worldEl.style.display = 'block';
  wbg.src = c.bg; wbg.alt = c.alt;
  try { await wbg.decode(); } catch (e) {}
  c.boards.forEach(b => { new Image().src = b.src; });
  closePanel(false);
  layoutStage();
  const h = c.hotspot;
  Object.assign(hotspot.style, { left: h.x * 100 + '%', top: h.y * 100 + '%', width: h.w * 100 + '%', height: h.h * 100 + '%' });
  hotspot.classList.toggle('ellipse', h.shape === 'ellipse');
  hotspot.classList.remove('on');
  hotspot.setAttribute('aria-label', h.label);
  $('hotlbl').textContent = h.label;
  c.setup(tok);
  layoutStage();

  wfade.style.background = o.fade || '#000';
  wfade.style.opacity = o.fade ? 1 : 0;
  await tween(1400, e => {
    const s = lerp(1.35, 1, e);
    cam.style.transform = `translate(${(1 - s) * innerWidth / 2}px, ${(1 - s) * innerHeight / 2}px) scale(${s})`;
    cam.style.filter = `blur(${lerp(10, 0, e).toFixed(2)}px)`;
    if (o.fade) wfade.style.opacity = 1 - e;
  }, easeOut);
  cam.style.filter = ''; cam.style.transform = ''; wfade.style.opacity = 0;
  if (!alive(tok)) return;

  $('wtk').textContent = c.kicker; $('wth').textContent = c.title; $('wts').textContent = c.sub;
  $('wtitle').classList.add('show');
  await sleep(2100);
  $('wtitle').classList.remove('show');
  await sleep(450);
  if (!alive(tok)) return;
  renderBoard(); openPanel();
  W.phase = 'boards';
  if (c.onBoards) run(() => c.onBoards(tok));
}

/* point at the next doorway from wherever he is (used while exploring) */
async function pointLoop(tok, fx, fy, side, rest) {
  const s = W.stick;
  while (alive(tok) && W.phase === 'explore') {
    const a = s.angleTo(fx, fy);
    if (side === 'R') { s.handR = null; await s.poseTo({ ru: a, rf: a, ex: Math.sign(Math.sin(a * D2R)) * .8 }, D(420)); }
    else { s.handL = null; await s.poseTo({ lu: a, lf: a, ex: Math.sign(Math.sin(a * D2R)) * .8 }, D(420)); }
    await nap(2200);
    if (!(alive(tok) && W.phase === 'explore')) break;
    await s.poseTo(rest, D(450));
    if (rest.__after) rest.__after();
    await nap(1400);
  }
}

function gearD(r, n, depth, hole, holes = 0, holeR = 0, holeAt = 0) {
  const ri = r - depth, pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * 2 * Math.PI, st = 2 * Math.PI / n;
    pts.push([ri, a], [r, a + st * .16], [r, a + st * .46], [ri, a + st * .62]);
  }
  let d = 'M' + pts.map(([rr, a]) => `${(Math.cos(a) * rr).toFixed(1)} ${(Math.sin(a) * rr).toFixed(1)}`).join(' L') + ' Z';
  const circ = (cx, cy, rr) => ` M${(cx - rr).toFixed(1)} ${cy.toFixed(1)} a${rr} ${rr} 0 1 0 ${(2 * rr).toFixed(1)} 0 a${rr} ${rr} 0 1 0 ${(-2 * rr).toFixed(1)} 0 Z`;
  if (hole) d += circ(0, 0, hole);
  for (let i = 0; i < holes; i++) { const a = i / holes * 2 * Math.PI + .3; d += circ(Math.cos(a) * holeAt, Math.sin(a) * holeAt, holeR); }
  return d;
}

function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function buildGearRoom() {
  const svgEl = $('gsvg'); svgEl.innerHTML = '';
  const portrait = innerWidth < innerHeight;
  const VW = portrait ? 900 : 1600, VH = portrait ? 1600 : 900;
  svgEl.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svgEl.style.overflow = 'visible';
  const defs = mk('defs', {}, svgEl);
  defs.innerHTML = `
    <radialGradient id="gBrass" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f4d58f"/><stop offset=".45" stop-color="#c3923f"/><stop offset="1" stop-color="#5e3f12"/></radialGradient>
    <radialGradient id="gIron" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#5a4c40"/><stop offset=".6" stop-color="#3a3029"/><stop offset="1" stop-color="#1e1814"/></radialGradient>
    <radialGradient id="gFar" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#3b3028"/><stop offset="1" stop-color="#191310"/></radialGradient>
    <filter id="gBlur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="gHalo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>`;
  const IP = portrait
    ? [[250, 430, 112], [640, 710, 118], [260, 1010, 112], [640, 1290, 118]]
    : [[300, 360, 118], [690, 600, 128], [1010, 330, 112], [1330, 600, 122]];
  // decorative gears, far layer then mid layer
  const rnd = seeded(portrait ? 77 : 42);
  const far = mk('g', { filter: 'url(#gBlur)', opacity: .55 }, svgEl), mid = mk('g', {}, svgEl);
  const placed = [];
  const free = (x, y, r, pad) => IP.every(([ix, iy, ir]) => Math.hypot(x - ix, y - iy) > ir + r + pad) &&
    !(x < 260 && y > VH - 240) && !(Math.abs(x - VW / 2) < 300 && y < 140);
  for (let k = 0; k < 220 && placed.length < 26; k++) {
    const layer = placed.length < 12 ? 'far' : 'mid';
    const r = layer === 'far' ? 60 + rnd() * 170 : 30 + rnd() * 80;
    const x = -250 + rnd() * (VW + 500), y = -200 + rnd() * (VH + 400);
    if (layer === 'mid' && !free(x, y, r, 26)) continue;
    if (layer === 'far' && !free(x, y, r * .4, 0)) continue;
    placed.push(1);
    const n = Math.max(8, Math.round(r / 9)), dur = (r / 6 + 8).toFixed(1);
    const g = mk('g', { transform: `translate(${x.toFixed(0)} ${y.toFixed(0)})` }, layer === 'far' ? far : mid);
    const sp = mk('g', { class: 'spin' + (rnd() < .5 ? ' rev' : ''), style: `--d:${dur}s` }, g);
    mk('path', { d: gearD(r, n, Math.min(16, r * .18), r * .18, r > 70 ? 5 : 0, r * .12, r * .55), 'fill-rule': 'evenodd',
      fill: layer === 'far' ? 'url(#gFar)' : 'url(#gIron)', stroke: layer === 'far' ? 'none' : '#4b4036', 'stroke-width': 2 }, sp);
  }
  // the four interactive gears
  IP.forEach(([x, y, r], i) => {
    const g = mk('g', { class: 'ggear', transform: `translate(${x} ${y})`, tabindex: 0, role: 'button', 'aria-label': `${String(i + 1).padStart(2, '0')} ${PROCESS[i].title}` }, svgEl);
    mk('circle', { class: 'halo', r: r + 8, fill: 'none', stroke: '#ffd27a', 'stroke-width': 14, filter: 'url(#gHalo)' }, g);
    const sp = mk('g', { class: 'spin' + (i % 2 ? ' rev' : ''), style: `--d:${36 + i * 5}s` }, g);
    const bump = mk('g', { class: 'bump' }, sp);
    mk('path', { d: gearD(r, Math.round(r / 8), 20, r * .2, 6, r * .13, r * .56), 'fill-rule': 'evenodd', fill: 'url(#gBrass)', stroke: '#3b2a10', 'stroke-width': 3 }, bump);
    mk('circle', { r: r * .2 + 9, fill: 'none', stroke: '#7a5520', 'stroke-width': 6 }, bump);
    const b = mk('g', { class: 'badge', transform: `translate(${(r * .74).toFixed(0)} ${(-r * .74).toFixed(0)})` }, g);
    mk('circle', { r: 17, fill: '#2fae6b', stroke: '#fff', 'stroke-width': 3 }, b);
    mk('path', { d: 'M-7 0 L-2 6 L8 -6', fill: 'none', stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, b);
    const tx = mk('text', { class: 'glabel', y: r + 36 }, g);
    mk('tspan', { class: 'n', x: 0 }, tx).textContent = String(i + 1).padStart(2, '0');
    mk('tspan', { class: 't', x: 0, dy: 26 }, tx).textContent = PROCESS[i].title;
    if (G.visited.has(i)) g.classList.add('done');
    g.addEventListener('click', () => openGear(i, g, bump));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGear(i, g, bump); } });
  });
}

function openGear(i, g, bump) {

  bub.className = 'bubble';
  const box = bump.getBoundingClientRect(), cx = box.left + box.width / 2, cy = box.top + box.height / 2, r = box.width / 2;
  const bw = bub.offsetWidth, bh = bub.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left, side = '';
  if (cx + r + 28 + bw < vw - 12) { left = cx + r + 28; side = 'toright'; }
  else if (cx - r - 28 - bw > 12) { left = cx - r - 28 - bw; side = 'toleft'; }
  else left = (vw - bw) / 2;
  let top = side ? clamp(cy - bh / 2, 70, vh - bh - 14) : clamp(cy + r + 10, 70, vh - bh - 14);
  Object.assign(bub.style, { left: left + 'px', top: top + 'px' });
  bub.style.setProperty('--ty', clamp(cy - top, 30, bh - 30) + 'px');
  bub.style.setProperty('--ox', side === 'toleft' ? '100%' : '0');
  if (side) bub.classList.add(side);
  requestAnimationFrame(() => bub.classList.add('show'));
  $('gprog').textContent = G.visited.size < 4 ? `${G.visited.size} of 4 gears visited` : 'All four gears visited — close the bubble.';
  $('bclose').focus({ preventScroll: true });
}
function closeBubble(silent) {
  $('bubble').classList.remove('show');
  G.open = -1;
  if (!silent && G.visited.size === 4 && !G.done) { G.done = true; $('gprog').textContent = 'All four gears are turning…'; pageTurn(); }
}
$('bclose').onclick = () => closeBubble(false);
addEventListener('keydown', e => { if (e.key === 'Escape' && G.open >= 0) closeBubble(false); });

/* page curl at the bottom-left corner */
let fold = 0;
function setFold(s) {
  fold = s;
  const px = s.toFixed(1);
  $('gfront').style.clipPath = s > .5 ? `polygon(0 0, 100% 0, 100% 100%, ${px}px 100%, 0 calc(100% - ${px}px))` : '';
  Object.assign($('flap').style, { width: px + 'px', height: px + 'px' });
}

async function pageTurn() {
  const page = $('gpage'), Wp = page.clientWidth, Hp = page.clientHeight;
  $('prof').style.display = 'grid'; $('profimg').src = IMG.about;     // the professional waits underneath
  await sleep(700);
  const s = new Stick($('gguy'), { color: '#f3e6d3' });
  const hFrac = Math.min(.22, 200 / Hp), feetY = .985, x1 = 66 / Wp;
  s.place(-.08, feetY, hFrac); s.p.ex = .9;
  await s.walkTo(x1, feetY, hFrac, 2300);                         // walks in from the left
  const tip = () => [fold / Wp, (Hp - fold) / Hp];
  const grab = () => { const [lx, ly] = s.toLocal(...tip()); s.handL = [lx, ly]; s.handR = [lx + 3, ly + 3]; };
  s.onTick = grab;
  await s.poseTo({ ex: -.9, hy: -42, t: -48, flx: -20, frx: 24, kl: 1, kr: -1, ey: .6 }, 700);   // crouches and grabs the corner
  await sleep(300);
  for (const [up, back] of [[38, 12], [66, 20], [50, 16]]) {          // pulls… it won't budge…
    await Promise.all([tween(650, e => setFold(lerp(fold, up, e)), easeOut), s.poseTo({ t: 24, hy: -60, smile: -.7, ey: 0 }, 650, easeOut)]);
    s.p.spark = 1; tween(300, e => { s.p.spark = 1 - e; });
    await Promise.all([tween(380, e => setFold(lerp(fold, back, e)), easeIn), s.poseTo({ t: -40, hy: -46 }, 380, easeIn)]);
    await sleep(160);
  }
  await Promise.all([tween(700, e => setFold(lerp(fold, 90, e)), easeInOut), s.poseTo({ t: 28, hy: -66, smile: .2 }, 700)]);
  // …then it gives way and lifts him off his feet
  s.handL = s.handR = null;
  Object.assign(s.p, { lu: 172, lf: 178, ru: -172, rf: -178, t: 0, hy: -72, flx: -14, fly: -4, frx: 14, fry: -8, smile: .9, ex: .4, ey: 0 });
  s.onTick = (t, st) => {
    const [tx, ty] = tip(), u = st.unit(), { W: Wc, H: Hc } = st.dims();
    st.add.flx = Math.sin(t * 7) * 10; st.add.frx = -Math.sin(t * 7) * 10;
    st.place(tx + 18 / Wc - st.hL[0] * u / Wc, ty - st.hL[1] * u / Hc, st.pos.h);
  };
  const big = Math.min(Wp, Hp) * .42;
  await tween(1100, e => setFold(lerp(90, big, e)), easeInOut);
  await tween(1700, e => { page.style.transform = `rotateY(${(180 * e).toFixed(2)}deg)`; }, easeInOut);   // the whole scene turns like a page
  s.destroy();
  $('gears').style.display = 'none';
  startProf();
}

/* ---------------------------------------------------------------------
   THE PROFESSIONAL → LIGHTS OUT → EXIT → THANK YOU
   --------------------------------------------------------------------- */
let profGuy = null;
function startProf() {
  const img = $('profimg');
  const fit = () => {
    const spare = (innerWidth - img.getBoundingClientRect().width) / 2;
    $('profguy').style.display = spare > 130 ? 'block' : 'none';
  };
  if (!profGuy) {
    profGuy = new Stick($('profguy'), { color: '#1b1b1b' });
    profGuy.place(.5, .97, .6);
    profGuy.p.ex = .8; profGuy.p.smile = .4;
    profGuy.onTick = (t, s) => { s.add.ex = Math.sin(t * .4) * .25; s.add.nk = Math.sin(t * .8) * 3; s.add.ru = Math.max(0, Math.sin(t * .5)) ** 8 * 120; s.add.rf = s.add.ru * 1.1; };
  }
  if (img.complete) fit(); else img.onload = fit;
  addEventListener('resize', fit);
  const cont = $('continue');
  cont.style.display = 'block';
  setTimeout(() => cont.classList.add('show'), WAIT(30000));       // appears after 30 seconds, stays until clicked
}

$('continue').onclick = async () => {
  const cont = $('continue'); cont.classList.remove('show'); cont.disabled = true;
  const bo = $('blackout'); bo.style.display = 'block';
  await tween(1300, e => { bo.style.opacity = e; });                // lights go out
  cont.style.display = 'none'; $('prof').style.display = 'none';
  if (profGuy) { profGuy.destroy(); profGuy = null; }
  await sleep(WAIT(5000));                                            // five seconds of darkness
  const sign = $('exitsign'), spill = $('spill');
  const set = on => { sign.style.opacity = on ? 1 : .05; sign.classList.toggle('flash', on); spill.style.transition = 'none'; spill.style.opacity = on ? .7 : 0; };
  for (const [on, ms] of [[1, 70], [0, 160], [1, 50], [0, 520], [1, 120], [0, 90], [1, 40], [0, 760], [1, 260], [0, 120], [1, 90], [0, 70]]) { set(on); await sleep(ms); }
  set(1); sign.classList.remove('flash'); sign.style.opacity = '';
  sign.classList.add('lit'); spill.style.transition = ''; spill.style.opacity = 1;
  sign.tabIndex = 0;
};

$('exitsign').onclick = async () => {
  const sign = $('exitsign'); if (!sign.classList.contains('lit')) return;
  sign.classList.remove('lit'); sign.style.opacity = 0; sign.tabIndex = -1;
  const th = $('thanks'); th.style.display = 'grid';
  const dz = $('dance');
  [['♪', '12%', '40%', '0s', '-30px'], ['♫', '82%', '30%', '.9s', '40px'], ['♪', '70%', '62%', '1.7s', '30px'], ['♫', '20%', '68%', '2.2s', '-40px']]
    .forEach(([c, l, t, d, dx]) => { const n = div('note', dz, { left: l, top: t, animationDelay: d }); n.style.setProperty('--dx', dx); n.textContent = c; });
  const s = new Stick(dz, { color: '#1b1b1b' });
  s.place(.5, .97, .78);
  s.p.smile = 1;
  s.onTick = boogie;
  await tween(1400, e => { $('blackout').style.opacity = 1 - e; });  // lights come back on
  $('blackout').style.display = 'none';
};

/* the boogie */
function boogie(t, s) {
  const b = t * Math.PI * 2 * 1.05, half = b / 2;
  const moves = [
    () => ({ ru: 75 + 60 * Math.sin(half), rf: 63 + 60 * Math.sin(half), lu: -40 - 18 * Math.sin(half), lf: -25 }),          // disco point
    () => ({ ru: 122 + 12 * Math.sin(b), rf: 148 + 12 * Math.sin(b), lu: -122 - 12 * Math.sin(b), lf: -148 - 12 * Math.sin(b) }),  // raise the roof
    () => ({ ru: 60 + 45 * Math.sin(half), rf: 95 + 45 * Math.sin(half), lu: -60 + 45 * Math.sin(half), lf: -95 + 45 * Math.sin(half) })  // arm swing
  ];
  const len = 4.2, k = Math.floor(t / len), f = (t % len) / .45;
  const A = moves[(k + 2) % 3](), B = moves[k % 3](), w = clamp(f);
  const lean = 7 * Math.sin(half);
  for (const key in B) s.add[key] = lerp(A[key], B[key], w) + lean - s.p[key];   // arms follow the body's lean
  const kick = Math.sin(half);
  s.add.hy = 10 * Math.abs(Math.cos(b));                      // bounce on every beat (knees bend, feet stay put)
  s.add.hx = 9 * Math.sin(half);
  s.add.t = lean;
  s.add.nk = 5 * Math.sin(b);
  s.add.fly = -16 * Math.max(0, kick) ** 2; s.add.flx = -8 * Math.max(0, kick);
  s.add.fry = -16 * Math.max(0, -kick) ** 2; s.add.frx = 8 * Math.max(0, -kick);
  s.add.ex = .5 * Math.sin(half);
}

/* ---------------------------------------------------------------------
   EXPRESS — the whole portfolio PDF, one page per click (unchanged)
   --------------------------------------------------------------------- */
const XN = 18;
let xi = 0;
const xsrc = n => `page-${String(n + 1).padStart(2, '0')}.jpg`;
function xshow() {
  $('ximg').src = xsrc(xi);
  $('ximg').alt = `Portfolio page ${xi + 1} of ${XN}`;
  $('xcount').textContent = `${xi + 1} / ${XN}`;
  $('xprev').disabled = xi === 0;
  $('xnext').disabled = xi === XN - 1;
  if (xi + 1 < XN) new Image().src = xsrc(xi + 1);
}
function openExpress() {
  document.getElementById('scene1').style.display = 'none';
  $('xview').style.display = 'block';
  xi = 0; xshow();
}
$('xprev').onclick = () => { if (xi > 0) { xi--; xshow(); } };
$('xnext').onclick = () => { if (xi < XN - 1) { xi++; xshow(); } };
$('ximg').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  (e.clientX - r.left > r.width / 2 ? $('xnext') : $('xprev')).click();
};
addEventListener('keydown', e => {
  if ($('xview').style.display !== 'block') return;
  if (e.key === 'ArrowRight') $('xnext').click();
  if (e.key === 'ArrowLeft') $('xprev').click();
});

/* hooks used by the opening scenes, plus test shortcuts (?fast) */
window.showWorld = showWorld;
window.openExpress = openExpress;
window.__dream = { showWorld, showGears, startProf, pageTurn, W, G, fireToGear };
})();
